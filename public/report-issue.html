<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Issue | NITC Portal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="dashboard-body">
  <header class="dash-header">
    <div class="user-info">
      <img id="user-avatar" src="https://ui-avatars.com/api/?name=Student+User" alt="Profile" class="avatar">
      <div>
        <h2 id="user-name">Student User</h2>
        <p id="user-dept">Department of Civil Engineering</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-profile"><i class="ph ph-user"></i></button>
      <button id="btn-settings"><i class="ph ph-gear"></i></button>
      <button id="btn-help"><i class="ph ph-question"></i></button>
    </div>
  </header>

  <main class="report-form-wrap">
    <form class="report-form">
      <h2>Report a campus issue</h2>
      <label>
        Issue Type
        <select>
          <option>Waste overflow</option>
          <option>Water leakage</option>
          <option>Broken infrastructure</option>
          <option>Other</option>
        </select>
      </label>
      <label>
        Location
        <input type="text" value="Near Admin Block" placeholder="Add the issue location">
      </label>
      <label>
        Description
        <textarea rows="5" placeholder="Describe the issue briefly"></textarea>
      </label>
      <label>
        Upload Photo
        <input type="file" accept="image/*">
      </label>
      <button type="submit">Submit Report</button>
    </form>
  </main>

  <div id="modal-profile" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2>Profile Management</h2>
      <label>Display Name: <input type="text" id="edit-name"></label>
      <label>Department/Hostel: <input type="text" id="edit-dept"></label>
      <label>Post Anonymously: <input type="checkbox" id="edit-anon"></label>
      <button class="close-modal">Close</button>
    </div>
  </div>

  <div id="modal-settings" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2>System Settings</h2>
      <button id="toggle-theme">Toggle Dark Mode</button>
      <button id="toggle-fullscreen">Toggle Fullscreen</button>
      <a href="/auth/logout" class="logout-btn">Logout</a>
      <button class="close-modal">Close</button>
    </div>
  </div>

  <div class="chatbot-container">
    <div id="chat-window" class="chat-window" style="display: none;">
      <div class="chat-header">NITC Support Agent</div>
      <div id="chat-log" class="chat-log"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ask for help...">
        <button id="chat-send"><i class="ph ph-paper-plane-right"></i></button>
      </div>
    </div>
    <button id="chat-fab" class="chat-fab"><i class="ph ph-chat-teardrop-text"></i></button>
  </div>

  <script src="app.js"></script>
</body>
</html>
